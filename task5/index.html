<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>To-Do Application</title>
    <link rel="stylesheet" href="style.css">
    <script src="script.js" defer></script>
</head>
<body>

    <div class="container">
        <h1>Rafia's To-Do List</h1>

        <form id="task-form">
            <input type="text" id="task-input" placeholder="Enter a new task..." autocomplete="off">
            <button type="submit">Add Task</button>
        </form>

        <div class="filters" id="filters">
            <button type="button" data-filter="all" class="active">All</button>
            <button type="button" data-filter="active">Active</button>
            <button type="button" data-filter="completed">Completed</button>
        </div>

        <ul id="task-list"></ul>

        <p id="task-count">0 tasks left</p>
    </div>

</body>
</html>
