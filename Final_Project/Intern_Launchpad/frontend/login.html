<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">

    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Intern Launchpad | Login</title>

    <script src="https://cdn.jsdelivr.net/npm/@tailwindcss/browser@4"></script>
</head>

<body class="bg-slate-100 min-h-screen flex items-center justify-center">

    <div class="bg-white p-8 rounded-2xl shadow-xl w-full max-w-md">

        <h1 class="text-3xl font-bold text-center text-indigo-600">
            Intern Launchpad
        </h1>

        <p class="text-center text-gray-500 mt-2">
            Welcome back! Login to your account.
        </p>

        <form id="loginForm" class="mt-8 space-y-5">

            <input
                type="text"
                id="username"
                placeholder="Username"
                required
                class="w-full p-3 border rounded-lg focus:outline-none focus:ring-2 focus:ring-indigo-500"
            >

            <input
                type="password"
                id="password"
                placeholder="Password"
                required
                class="w-full p-3 border rounded-lg focus:outline-none focus:ring-2 focus:ring-indigo-500"
            >

            <button
                type="submit"
                class="w-full bg-indigo-600 text-white p-3 rounded-lg hover:bg-indigo-700"
            >
                Login
            </button>

        </form>

        <p id="message" class="text-center mt-4"></p>

    </div>

    <script src="js/auth.js"></script>

</body>
</html>
