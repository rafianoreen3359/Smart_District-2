<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="stylesheet" href="style.css">
    <title>Public API Explorer</title>
    <script type="module" src="app.js"></script>
</head>
<body>
   <header>
    <h1>Public API Explorer</h1>
    <p>Explore users and post from public APIs</p>
    <button id="refreshBtn">Refresh Data</button>
   </header> 
<main class="dashboard">
    <section class="panel">
        <h2>Users</h2>
        <div id="users" class="content">
            <p>Loading users.....</p>
        </div>
    </section>
    <section class="panel">
        <h2>Posts</h2>
        <div id="posts" class="content">
            <p>Loading posts.....</p>
        </div>
    </section>
</main>
<footer>
    <p>&copy; Built with HTML, CSS, JavaScript and APIs. </p>
</footer>
</body>
</html>
